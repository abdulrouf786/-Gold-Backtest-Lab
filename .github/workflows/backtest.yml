name: Gold strategy backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Run Binance Gold-token backtest
        env:
          SYMBOL: PAXGUSDT
          INTERVAL: 15m
          DAYS: "60"
          RR: "2.0"
          ATR_MULT: "1.5"
        run: python backtest.py
      - name: Upload backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-backtest-reports
          path: reports/
          if-no-files-found: warn
      - name: Send Telegram result
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BACKTEST_STATUS: ${{ job.status }}
        run: python telegram_notify.py
