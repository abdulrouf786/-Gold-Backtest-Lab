name: Gold strategy backtest
on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: python backtest.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: gold-backtest-reports
          path: reports/
          if-no-files-found: error
